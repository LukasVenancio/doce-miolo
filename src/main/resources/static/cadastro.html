<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#fffdf8"><title>Criar conta | Doce Miolo</title><link rel="stylesheet" href="css/styles.css"><script type="module" src="js/auth-page.js"></script></head>
<body>
  <header class="site-header"><nav class="nav-shell" aria-label="Navegação principal"><a class="brand" href="index.html"><span class="brand-mark">d</span>doce miolo</a><div class="nav-links"><a href="index.html">Cardápio</a></div><div class="nav-actions"><a class="button button-small button-outline" href="login.html">Entrar</a></div></nav></header>
  <main class="section"><div class="container" style="max-width:560px"><p class="eyebrow">Seu cantinho doce</p><h1 style="font-size:42px">Crie sua conta</h1><p class="muted">Acompanhe seus pedidos e salve suas escolhas.</p>
    <form class="panel stack" data-register-form><div class="notice" data-notice role="alert"></div><div class="field"><label for="nome">Nome</label><input id="nome" name="nome" autocomplete="name" required maxlength="120"></div><div class="field"><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="email" required maxlength="254"></div><div class="field"><label for="senha">Senha</label><input id="senha" name="senha" type="password" autocomplete="new-password" required minlength="8" maxlength="72"><span class="field-hint">Use pelo menos 8 caracteres.</span></div><button class="button" type="submit">Criar conta</button><p class="muted" style="margin:0;font-size:13px">Já tem uma conta? <a href="login.html" style="color:var(--leaf);font-weight:700">Entrar</a></p></form>
  </div></main><footer class="site-footer"><div class="container footer-inner"><a class="brand" href="index.html"><span class="brand-mark">d</span>doce miolo</a><p class="footer-copy">© 2026 Doce Miolo</p></div></footer><div class="toast-region" data-toast-region aria-live="polite"></div>
