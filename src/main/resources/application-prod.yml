spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/cupcakes}
    username: ${DATABASE_USER:cupcakes}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

jwt:
  secret: ${JWT_SECRET}

server:
  address: 0.0.0.0
  port: ${PORT:8080}
  error:
    include-message: never